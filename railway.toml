# Prefer: set Railway Root Directory = "web" and deploy from web/.
# This root config is a fallback when Root Directory is empty.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["web/**"]

[deploy]
# release 阶段跑一次；npm start 里也会再跑一次做兜底。
# 实测 releaseCommand 在本服务上未必生效，只靠它会导致迁移被静默跳过。
releaseCommand = "npm run db:deploy"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
