# Used when Railway Root Directory = web
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
# 迁移的唯一入口：release 阶段跑一次，容器启动不再重复跑 db push
releaseCommand = "npm run db:deploy"
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
